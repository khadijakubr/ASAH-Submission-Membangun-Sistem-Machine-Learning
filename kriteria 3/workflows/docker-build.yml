name: Build and Push Docker Image

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: 'MLflow Run ID (dari training sebelumnya)'
        required: true
        type: string
      docker_tag:
        description: 'Docker tag (default: latest)'
        required: false
        default: 'latest'
        type: string

jobs:
  build-docker:
    runs-on: ubuntu-latest
    
    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v3

      - name: 🐍 Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: 📦 Install MLflow
        run: |
          python -m pip install --upgrade pip
          pip install mlflow

      - name: 📥 Download training artifacts
        uses: dawidd6/action-download-artifact@v2
        with:
          workflow: train.yml
          name: mlflow-training-artifacts-*
          name_is_regexp: true
          path: ./artifacts
          if_no_artifact_found: warn

      - name: 📦 Extract artifacts if available
        run: |
          if [ -f ./artifacts/mlflow-artifacts.tar.gz ]; then
            cd MLProject
            tar -xzf ../artifacts/mlflow-artifacts.tar.gz
            echo "✅ Artifacts extracted"
          else
            echo "⚠️ No artifacts found, will need to train first"
          fi

      - name: 🔍 Verify Run ID exists
        working-directory: ./MLProject
        run: |
          RUN_ID="${{ inputs.run_id }}"
          if [ -d "mlruns/0/$RUN_ID" ]; then
            echo "✅ Run ID found: $RUN_ID"
            ls -la mlruns/0/$RUN_ID/artifacts/
          else
            echo "❌ Run ID not found: $RUN_ID"
            echo "Available runs:"
            ls -la mlruns/0/ || echo "No mlruns directory found"
            exit 1
          fi

      - name: 🐳 Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: 🔐 Login to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: 🏗️ Build Docker Image with MLflow
        working-directory: ./MLProject
        run: |
          echo "Building Docker image for Run ID: ${{ inputs.run_id }}"
          
          mlflow models build-docker \
            -m "mlruns/0/${{ inputs.run_id }}/artifacts/model" \
            -n "${{ secrets.DOCKER_USERNAME }}/insurance-model:${{ inputs.docker_tag }}" \
            --enable-mlserver
          
          echo "✅ Docker image built successfully"

      - name: 🏷️ Tag as latest (if not already)
        if: inputs.docker_tag != 'latest'
        run: |
          docker tag ${{ secrets.DOCKER_USERNAME }}/insurance-model:${{ inputs.docker_tag }} \
            ${{ secrets.DOCKER_USERNAME }}/insurance-model:latest

      - name: 🚀 Push Docker Image to Docker Hub
        run: |
          echo "Pushing image with tag: ${{ inputs.docker_tag }}"
          docker push ${{ secrets.DOCKER_USERNAME }}/insurance-model:${{ inputs.docker_tag }}
          
          if [ "${{ inputs.docker_tag }}" != "latest" ]; then
            echo "Pushing latest tag as well"
            docker push ${{ secrets.DOCKER_USERNAME }}/insurance-model:latest
          fi
          
          echo "✅ All images pushed successfully"

      - name: 📊 Docker Image Info
        run: |
          echo "Docker image details:"
          docker images | grep insurance-model

      - name: 📝 Create Step Summary
        run: |
          echo "## 🐳 Docker Build Completed!" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 📊 Details" >> $GITHUB_STEP_SUMMARY
          echo "- **Docker Hub:** [\`${{ secrets.DOCKER_USERNAME }}/insurance-model\`](https://hub.docker.com/r/${{ secrets.DOCKER_USERNAME }}/insurance-model)" >> $GITHUB_STEP_SUMMARY
          echo "- **Tags:** \`${{ inputs.docker_tag }}\`, \`latest\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Run ID:** \`${{ inputs.run_id }}\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 🚀 Usage" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`bash" >> $GITHUB_STEP_SUMMARY
          echo "# Pull the image" >> $GITHUB_STEP_SUMMARY
          echo "docker pull ${{ secrets.DOCKER_USERNAME }}/insurance-model:${{ inputs.docker_tag }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "# Run the model server" >> $GITHUB_STEP_SUMMARY
          echo "docker run -p 5000:5000 ${{ secrets.DOCKER_USERNAME }}/insurance-model:${{ inputs.docker_tag }}" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY

      - name: 💬 Create Docker Hub Link Comment
        uses: actions/github-script@v6
        if: github.event_name == 'workflow_dispatch'
        with:
          script: |
            const message = `🐳 Docker image built and pushed successfully!
            
            **Docker Hub:** https://hub.docker.com/r/${{ secrets.DOCKER_USERNAME }}/insurance-model
            **Tags:** \`${{ inputs.docker_tag }}\`, \`latest\`
            **Run ID:** \`${{ inputs.run_id }}\`
            
            ### Pull and run:
            \`\`\`bash
            docker pull ${{ secrets.DOCKER_USERNAME }}/insurance-model:${{ inputs.docker_tag }}
            docker run -p 5000:5000 ${{ secrets.DOCKER_USERNAME }}/insurance-model:${{ inputs.docker_tag }}
            \`\`\``;
            
            // This will show in the workflow run page
            console.log(message);
